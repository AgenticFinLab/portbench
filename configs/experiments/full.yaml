# PortBench full closed-loop sweep: 2x2x2 architectures × all production models.
#
# Matrix:
#   10 LLM backbones × 8 architecture cells (SA/MA × memory × tools)
#   + 6 quantitative baselines (no architecture_id; pipeline-v1)
#   × 3 investor profiles
#   × 3 stress windows + 2 preregistered normal windows
#
# Architecture IDs (topology × memory × tools):
#   SA, SA-T, SA-M, SA-MT, MA, MA-T, MA-M, MA-MT
# Model artifacts are stored as {model}__{architecture_id}.
#
# This is NOT a drop-in replacement for configs/experiments/default.yaml.
# default.yaml runs the legacy pipeline-v1 backbone (deterministic S4/S5).
# This file always uses pipeline-v3-collab for LLM cells (agentic S4/S5).
#
# Scale (closed-loop cells): 86 model entries × 3 profiles × 5 windows = 1290 backtests.
# Dry-run first. Prefer committing this file before launching so code_commit is stable.
#
# Launch:
#   .venv\Scripts\python.exe -m portbench.experiments --config configs/experiments/full.yaml --dry-run
#   .venv\Scripts\python.exe -m portbench.experiments --config configs/experiments/full.yaml

batch_id: "agentic_full_{date}"

data_provider: processed
data_version: processed-v1
data_dir: datasets/processed
sec_dir: datasets/sec
rebalance: monthly
initial_nav: 1000000
# Required whenever any model sets architecture_id (exact usage attribution).
workers_per_experiment: 1
parallel_experiments: 2
seed: 42

generation:
  temperature: 0.0
  max_tokens: 8192

resource_budget:
  max_tokens_per_episode: 32000
  max_requests_per_episode: 24
  config_version: iso-token-v3

models:
