# Frozen T3-D/T4-D SA-only formal QA matrix.
batch_id: "sa_upgrade_qa_decision_{date}"
data_provider: processed
data_version: processed-v1
data_dir: datasets/processed
sec_dir: datasets/sec
rebalance: monthly
initial_nav: 1000000
pipeline_schema_version: pipeline-v4-sa-causal
sa_only: true
call_artifact_root: EXPERIMENTS_SA_UPGRADE/shared_call_artifacts_decision_v2
required_gate: EXPERIMENTS_SA_UPGRADE/gates/qa_decision_v2_val.json
workers_per_experiment: 1
parallel_experiments: 3
seed: 42
use_tools: false
call_max_attempts: 3
retry_failed_calls: false
generation:
  temperature: 0.0
  max_tokens: 4096
resource_budget:
  max_tokens_per_episode: 0
  max_requests_per_episode: 0
  config_version: iso-token-decision-v2
models:
  - {provider: tencent, model: hy3-preview, architecture_id: SA}
  - {provider: tencent, model: deepseek-v4-pro, architecture_id: SA}
  - {provider: tencent, model: deepseek-v4-flash, architecture_id: SA}
  - {provider: ark, model: doubao-seed-2-0-pro-260215, architecture_id: SA}
  - {provider: ark, model: doubao-seed-2-0-lite-260215, architecture_id: SA}
  - {provider: dashscope, model: qwen3.7-max, architecture_id: SA}
  - {provider: dashscope, model: qwen3.6-plus, architecture_id: SA}
  - {provider: dashscope, model: kimi-k2.6, architecture_id: SA}
  - {provider: dashscope, model: glm-5.1, architecture_id: SA}
  - {provider: dashscope, model: qwen3.6-35b-a3b, architecture_id: SA}
profiles: [balanced]
stress_scenarios: [2022_crypto_collapse]
run_normal: false
oracle_mode: lookback
experiment_tag: sa_upgrade_qa_decision_v2_v1
logging:
  save_pipeline_logs: true
  save_snapshots: true
  save_figures: true
on_error: isolate
output_root: EXPERIMENTS
timeout: 600
propagation_weight: 0.1
reuse_latest: true
run_sandbox: false
interventions:
  enabled: false
  stages: [S1, S2, S3, S4, S5]
  operator: repair
  mode: online
  closed_loop: false
run_qa: true
qa:
  dataset_path: datasets/qa-decision-v2-constraint
  split: test
  templates: [T3, T4]
  max_pairs_per_template: 50
  parallel_questions: 1
  save_responses: true
  template_version: constraint-decision-v2
  scorer_version: qa-decision-v2
  call_max_attempts: 3
  retry_failed_calls: false
  freeze_manifest: datasets/qa-decision-v2-constraint/constraint_decision_v2_test_manifest.json
