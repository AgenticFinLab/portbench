# PortBench hy3 closed-loop sweep: 2x2x2 architectures × tencent/hy3-preview.
#
# Matrix:
#   hy3-preview × 8 architecture cells (SA/MA × memory × tools)
#   + 6 quantitative baselines (no architecture_id; pipeline-v1)
#   × 3 investor profiles
#   × 3 stress windows + 2 preregistered normal windows
#
# Architecture IDs (topology × memory × tools):
#   SA, SA-T, SA-M, SA-MT, MA, MA-T, MA-M, MA-MT
# Model artifacts are stored as {model}__{architecture_id}.
#
# LLM cells use pipeline-v3-collab (agentic S4/S5). Baselines stay pipeline-v1.
#
# Launch:
#   .venv\Scripts\python.exe -m portbench.experiments --config configs/experiments/full_hy3.yaml --dry-run
#   .venv\Scripts\python.exe -m portbench.experiments --config configs/experiments/full_hy3.yaml

batch_id: "agentic_full_hy3_{date}"

data_provider: processed
data_version: processed-v1
data_dir: datasets/processed
sec_dir: datasets/sec
rebalance: monthly
initial_nav: 1000000
# Required whenever any model sets architecture_id (exact usage attribution).
workers_per_experiment: 1
parallel_experiments: 2
seed: 42

generation:
  temperature: 0.0
  max_tokens: 8192

resource_budget:
  # 0 = record usage only; do not abort the episode.
  max_tokens_per_episode: 0
  max_requests_per_episode: 0
  config_version: iso-token-v3

models:
  - {provider: tencent, model: hy3-preview, architecture_id: SA}
  - {provider: tencent, model: hy3-preview, architecture_id: SA-T}
  - {provider: tencent, model: hy3-preview, architecture_id: SA-M}
  - {provider: tencent, model: hy3-preview, architecture_id: SA-MT}
  - {provider: tencent, model: hy3-preview, architecture_id: MA}
  - {provider: tencent, model: hy3-preview, architecture_id: MA-T}
  - {provider: tencent, model: hy3-preview, architecture_id: MA-M}
  - {provider: tencent, model: hy3-preview, architecture_id: MA-MT}

  # Quantitative references (legacy pipeline; no LLM).
  - baseline: equal_weight
  - baseline: risk_parity
  - baseline: sixty_forty
  - baseline: cov_risk_parity
  - baseline: min_variance
  - baseline: black_litterman

# profiles: [conservative, balanced, aggressive]
profiles: [balanced]
# stress_scenarios: [2015_china_shock, 2020_covid_flash_crash, 2022_crypto_collapse]
stress_scenarios: [2022_crypto_collapse]
run_normal: true
normal_periods:
  - {start: 2024-01-01, end: 2024-12-31, label: balanced_bull_2024}
  # - {start: 2022-07-01, end: 2022-12-31, label: conservative_pressure_2022h2}

oracle_mode: lookback
experiment_tag: agentic_full_hy3_v3
logging:
  save_pipeline_logs: true
  save_snapshots: true
  save_figures: true

on_error: isolate
output_root: EXPERIMENTS
timeout: 600
propagation_weight: 0.1
reuse_latest: true

interventions:
  enabled: true
  stages: [S1, S2, S3, S4, S5]
  # repair  — replace the stage output with the Point-in-Time ground-truth reconstruction
  # perturb — shock the model's factual output with the built-in +10% stance amplification
  operator: repair
  # offline — no extra LLM; deterministic suffix; CEPS / stage-score deltas only (not NAV)
  # online  — re-run the downstream agent; same CEPS/score-delta family, more expensive
  mode: online
  # true  — also fork NAV from the first rebalance of the window (portfolio-path effect)
  # cheap with mode=offline (default on); do not pair with mode=online unless you accept extra LLM
  closed_loop: true

run_qa: false
qa:
  dataset_path: datasets/qa_dataset
  split: test
  templates: [T1, T2, T3, T4, T5, T6, T7]
  max_pairs_per_template: 50
  parallel_questions: 8
  save_responses: true
  info_level: both
  t3t4_redesign: false
  t3t4_numeric_weight: 0.7
  t3t4_explanation_weight: 0.3

sigma_ablation_values: [0.0, 0.25, 0.5, 0.75, 1.0]
